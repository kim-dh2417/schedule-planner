services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

  web-prod:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    profiles:
      - production
